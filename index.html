<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVAAN — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="side-mark" role="presentation"></div>
  <main class="stage" id="stage" aria-label="portfolio pinboard">
    <h1 class="visually-hidden">EUNBYN AN — Fashion Designer Portfolio</h1>
    <img class="board-img" src="assets/board.jpg" alt="" draggable="false">
    <header class="identity" id="identity">
      <div class="identity-line1" id="identityLine1"></div>
      <div class="identity-line2" id="identityLine2"></div>
    </header>
    <div class="overlays" id="overlays"></div>
    <footer class="signature" id="signature">
      <span id="sigName"></span><span class="sig-dot"> · </span><span id="sigEmail"></span>
    </footer>
  </main>
  <script src="projects.js"></script>
  <script src="main.js"></script>

</html>
