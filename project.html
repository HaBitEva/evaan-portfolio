<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EUNBYN AN — Project</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>
  <h1 class="visually-hidden" id="pageHeading"></h1>
  <a class="back-link" href="index.html">&larr; Board</a>

  <main class="note-stage" id="noteStage">
    <img class="note-img" src="assets/notebook.jpg" alt="" draggable="false">
    <div class="label-text">
      <div class="label-title" id="labelTitle"></div>
      <div class="label-season" id="labelSeason"></div>
    </div>
    <div class="spec-lines">
      <div id="spec1"></div>
      <div id="spec2"></div>
    </div>
    <img class="page-photo" id="pagePhoto" src="" alt="">
    <div class="page-caption" id="pageCaption"></div>
    <div class="cover" id="cover">
      <div class="cover-flip">
        <img id="coverImg" src="" alt="" draggable="false">
      </div>
    </div>
    <div class="turn-hot" id="turnHot" aria-label="next page"></div>
  </main>

  <main class="album-stage" id="albumStage">
    <div class="album-flip" id="albumFlip">
      <img class="album-img" src="assets/album.jpg" alt="" draggable="false">
      <div class="album-area" id="albumArea"></div>
      <div class="album-legend" id="albumLegend"></div>
    </div>
    <div class="album-hot" id="albumHot" aria-label="next page"></div>
  </main>

  <main class="strip-stage" id="stripStage">
    <div class="strip-title" id="stripTitle"></div>
    <div class="strip-viewport" id="stripViewport">
      <div class="strip-track" id="stripTrack"></div>
    </div>
  </main>

  <main class="env-stage" id="envStage">
    <a class="pdf-btn" id="pdfBtn" href="#" target="_blank" rel="noopener">Portfolio ↗</a>
    <div class="env-row" id="envRow"></div>
  </main>

  <main class="cs-stage" id="csStage">
    <header class="cs-head">
      <div class="cs-title" id="csTitle"></div>
      <div class="cs-sub">DESIGN — SIMULATION — RENDER, ALL IN CLO 3D</div>
    </header>
    <div id="csBody"></div>
  </main>

  <main class="ig-stage" id="igStage">
    <header class="ig-profile">
      <div class="ig-avatar" id="igAvatar"></div>
      <div class="ig-meta">
        <div class="ig-id" id="igId"></div>
        <div class="ig-stats" id="igStats"></div>
        <div class="ig-bio" id="igBio"></div>
        <a class="ig-link" id="igLink" target="_blank" rel="noopener"></a>
      </div>
    </header>
    <nav class="ig-tabs">
      <button class="ig-tab on" type="button" aria-label="grid">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6"/><rect x="9" y="2" width="6" height="6"/><rect x="16" y="2" width="6" height="6"/>
          <rect x="2" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/><rect x="16" y="9" width="6" height="6"/>
          <rect x="2" y="16" width="6" height="6"/><rect x="9" y="16" width="6" height="6"/><rect x="16" y="16" width="6" height="6"/>
        </svg><span>Posts</span>
      </button>
      <button class="ig-tab" type="button" aria-label="reels" disabled>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="19" rx="4"/><path d="M2.8 8h18.4M8.5 2.6 12 8M15 2.6 18.4 8"/><path d="m10.4 12.2 4.2 2.4-4.2 2.4z" fill="currentColor" stroke="none"/>
        </svg><span>Reels</span>
      </button>
      <button class="ig-tab" type="button" aria-label="tagged" disabled>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="2.5" y="3.5" width="19" height="17" rx="3"/><circle cx="12" cy="10" r="2.6"/><path d="M7.5 18a4.5 4.5 0 0 1 9 0"/>
        </svg><span>Tagged</span>
      </button>
    </nav>
    <div class="ig-grid" id="igGrid"></div>
  </main>

  <div class="ig-modal" id="igModal" hidden>
    <div class="ig-modal-bg" id="igModalBg"></div>
    <div class="ig-modal-box">
      <button class="ig-close" id="igClose" aria-label="close">&times;</button>
      <div class="ig-carousel" id="igCarousel">
        <div class="ig-slides" id="igSlides"></div>
        <button class="ig-arrow prev" id="igPrev" aria-label="previous">&#8249;</button>
        <button class="ig-arrow next" id="igNext" aria-label="next">&#8250;</button>
        <div class="ig-dots" id="igDots"></div>
      </div>
      <aside class="ig-side">
        <div class="ig-side-head">
          <span class="ig-side-av" id="igSideAv"></span>
          <span class="ig-side-id" id="igSideId"></span>
          <span class="ig-dots-btn">&#8943;</span>
        </div>
        <div class="ig-side-body">
          <div class="ig-post-title" id="igTitle"></div>
          <p class="ig-caption"><b id="igCapId"></b> <span id="igCaption"></span></p>
          <div class="ig-tags" id="igTags"></div>
        </div>
        <div class="ig-actions">
          <button class="ig-heart" id="igHeart" aria-label="like">
            <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 21s-8.5-5.4-8.5-11A4.7 4.7 0 0 1 12 7.2 4.7 4.7 0 0 1 20.5 10c0 5.6-8.5 11-8.5 11z"/></svg>
          </button>
          <button class="ig-act" aria-label="comment">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
          </button>
          <button class="ig-act" aria-label="share">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
          <button class="ig-act save" aria-label="save">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M19 21 12 16l-7 5V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1z"/></svg>
          </button>
        </div>
        <div class="ig-side-foot">
          <span class="ig-likes" id="igLikes"></span>
          <span class="ig-comments" id="igComments"></span>
          <span class="ig-time" id="igTime"></span>
        </div>
      </aside>
    </div>
  </div>

  <div class="pager" id="pager">
    <button id="prevBtn" aria-label="previous page">&larr;</button>
    <span class="counter" id="counter"></span>
    <button id="nextBtn" aria-label="next page">&rarr;</button>
  </div>

  <script src="details.js"></script>
  <script src="project.js"></script>
</body>
</html>
